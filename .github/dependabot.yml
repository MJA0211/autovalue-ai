version: 2

updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/New_York
    open-pull-requests-limit: 3
    # Remove when AutoValue intentionally moves from Python 3.11 to Python 3.12+.
    ignore:
      - dependency-name: "numpy"
        versions: [">=2.5.0"]
    groups:
      python-compatible-updates:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
      day: monday
      time: "09:20"
      timezone: America/New_York
    open-pull-requests-limit: 3
    groups:
      frontend-compatible-updates:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:40"
      timezone: America/New_York
    open-pull-requests-limit: 2
    groups:
      actions-compatible-updates:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
