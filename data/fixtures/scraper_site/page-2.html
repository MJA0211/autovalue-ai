<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>AutoValue Synthetic Inventory — Page 2</title>
  </head>
  <body>
    <main>
      <h1>Synthetic vehicle inventory</h1>

      <!-- Intentional exact duplicate from page 1; the scraper must count and skip it. -->
      <article class="vehicle-card" data-listing-id="synthetic-002">
        <a class="vehicle-card__link" href="/vehicles/synthetic-002">View invented vehicle</a>
        <span data-field="year">2019</span>
        <span data-field="make">Subaru</span>
        <span data-field="model">Outback</span>
        <span data-field="trim">Premium</span>
        <span data-field="mileage">62,480 mi</span>
        <span data-field="condition">Very good</span>
        <span data-field="engine">2.5L H4</span>
        <span data-field="drivetrain">AWD</span>
        <span data-field="accident-status">Unknown</span>
        <span data-field="accident-count">Not reported</span>
        <span data-field="owner-count">2 owners</span>
        <span data-field="vehicle-type">Wagon</span>
        <span data-field="price" data-currency="USD" data-price-kind="asking">$19,450</span>
      </article>

      <article class="vehicle-card" data-listing-id="synthetic-003">
        <a class="vehicle-card__link" href="/vehicles/synthetic-003">View invented vehicle</a>
        <span data-field="year">2022</span>
        <span data-field="make">Ford</span>
        <span data-field="model">F-150</span>
        <span data-field="trim">XLT</span>
        <span data-field="mileage">28,005 mi</span>
        <span data-field="condition">Excellent</span>
        <span data-field="engine">3.5L V6</span>
        <span data-field="drivetrain">4WD</span>
        <span data-field="accident-status">One reported</span>
        <span data-field="accident-count">1</span>
        <span data-field="owner-count">1 owner</span>
        <span data-field="vehicle-type">Pickup truck</span>
        <span data-field="price" data-currency="USD" data-price-kind="asking">$38,700</span>
      </article>

      <a rel="next" href="/page-3.html">Next page</a>
    </main>
  </body>
</html>
