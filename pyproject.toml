[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
pythonpath = ["backend/src", "ml/src"]

[tool.coverage.run]
branch = true
source = ["backend/src", "ml/src"]
omit = ["ml/src/autovalue_ml/acquisition/demo.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data", "models", "frontend"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
mypy_path = ["backend/src", "ml/src"]
